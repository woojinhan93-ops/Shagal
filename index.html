<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>샤갈</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Nunito',sans-serif;background:#fff;color:#1a1a2e;min-height:100dvh}

.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #f0f0f0;z-index:50;padding:4px 0 env(safe-area-inset-bottom,6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:#c0c0c0;transition:color .2s;border:none;background:none;font-family:'Nunito'}
.tab.active{color:#1a1a2e}
.tab svg{width:20px;height:20px;fill:currentColor}
.tab span{font-size:9px;font-weight:700}

.page{display:none;min-height:100dvh;padding:0 20px 80px}
.page.active{display:flex;flex-direction:column}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:420px;padding:24px 20px 36px;animation:su .2s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:17px;font-weight:900;margin-bottom:16px}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f5f5f5}
.s-row:last-child{border:none}
.s-row.col{flex-direction:column;align-items:flex-start;gap:8px}
.s-label{font-size:14px;font-weight:700}
.s-sub{font-size:11px;color:#aaa}
.lang-tog{display:flex;background:#f3f3f5;border-radius:10px;overflow:hidden}
.lang-o{padding:7px 16px;font-size:12px;font-weight:800;border:none;background:none;cursor:pointer;color:#aaa;font-family:'Nunito';transition:all .15s}
.lang-o.on{background:#1a1a2e;color:#fff;border-radius:10px}
.m-close{margin-top:16px;width:100%;padding:13px;border-radius:14px;border:none;background:#f3f3f5;font-family:'Nunito';font-size:14px;font-weight:800;cursor:pointer;color:#1a1a2e}
.pe-chips{display:flex;flex-wrap:wrap;gap:6px}
.pe-chip{display:flex;align-items:center;gap:5px;background:#f3f3f5;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.pe-x{width:18px;height:18px;border-radius:50%;background:#e0e0e0;border:none;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;color:#888}
.pe-add{display:flex;gap:6px;align-items:center}
.pe-in{width:48px;padding:6px;border-radius:8px;border:1.5px solid #e0e0e0;font-family:'Nunito';font-size:13px;font-weight:700;text-align:center}
.pe-in:focus{outline:none;border-color:#1a1a2e}
.pe-btn{padding:6px 14px;border-radius:8px;border:none;background:#1a1a2e;color:#fff;font-family:'Nunito';font-size:12px;font-weight:800;cursor:pointer}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:48px 0 0}
.hdr-title{font-size:18px;font-weight:900}
.set-btn{width:36px;height:36px;border-radius:50%;background:#f5f5f5;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.set-btn svg{width:18px;height:18px;fill:#999}

/* Timer */
.timer-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:16px}
.timer-num{font-size:104px;font-weight:900;line-height:1;letter-spacing:-4px;color:#1a1a2e;transition:color .3s}
.timer-num.final{color:#FF8C42;animation:shake .3s ease infinite}
.timer-num.done{color:#34C759}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.timer-sub{font-size:14px;font-weight:700;color:#c0c0c0;margin:6px 0 36px}
.t-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.t-btn{background:#f5f5f5;border:2px solid transparent;color:#1a1a2e;font-family:'Nunito';font-size:15px;font-weight:800;padding:12px 20px;border-radius:14px;cursor:pointer;transition:all .12s;min-width:72px;text-align:center}
.t-btn:active{transform:scale(.94)}
.t-btn.on{border-color:#1a1a2e;background:#fff}
.adj-row{display:flex;align-items:center;gap:22px;margin-bottom:32px}
.adj-b{width:46px;height:46px;border-radius:50%;background:#f5f5f5;border:none;color:#1a1a2e;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Nunito';transition:all .1s}
.adj-b:active{transform:scale(.88)}
.adj-v{font-size:18px;font-weight:800;min-width:52px;text-align:center}
.go{width:100%;max-width:280px;padding:16px;border-radius:16px;border:none;background:#1a1a2e;color:#fff;font-family:'Nunito';font-size:17px;font-weight:800;cursor:pointer;transition:all .12s}
.go:active{transform:scale(.97)}
.go.running{background:#FF8C42}
.sr{display:flex;align-items:center;gap:12px;margin-top:24px}
.sl{font-size:13px;font-weight:700;color:#c0c0c0}
.sn{font-size:26px;font-weight:900;color:#1a1a2e}
.sc{font-size:11px;font-weight:700;color:#aaa;background:#f5f5f5;border:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:'Nunito'}

/* Calendar */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:48px 0 16px}
.cal-title{font-size:18px;font-weight:900}
.cal-nav{display:flex;gap:6px}
.cal-arr{width:34px;height:34px;border-radius:50%;background:#f5f5f5;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800;color:#999}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dl{text-align:center;font-size:10px;font-weight:700;color:#c0c0c0;padding:6px 0}
.cal-c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#d0d0d0}
.cal-c.hd{color:#1a1a2e;background:#f5f5f5}
.cal-c.td{background:#1a1a2e;color:#fff}
.cal-c .cs{font-size:8px;font-weight:800;color:#888;margin-top:1px}
.cal-c.td .cs{color:rgba(255,255,255,.7)}

.summary-cards{display:flex;gap:10px;margin-top:16px}
.sum-card{flex:1;padding:14px;background:#f9f9fb;border-radius:14px;text-align:center}
.sum-card-label{font-size:11px;font-weight:700;color:#999;margin-bottom:4px}
.sum-card-num{font-size:22px;font-weight:900;color:#1a1a2e}

/* Stats page */
.stats-hdr{padding:48px 0 16px}
.stats-hdr h2{font-size:18px;font-weight:900}
.view-toggle{display:flex;background:#f3f3f5;border-radius:10px;overflow:hidden;margin-bottom:16px}
.view-o{flex:1;padding:10px;font-size:13px;font-weight:800;border:none;background:none;cursor:pointer;color:#aaa;font-family:'Nunito';transition:all .15s;text-align:center}
.view-o.on{background:#1a1a2e;color:#fff;border-radius:10px}

.chart-area{background:#f9f9fb;border-radius:16px;padding:16px 12px 12px;margin-bottom:16px}
.chart-title{font-size:12px;font-weight:700;color:#999;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding:0 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:6px 6px 4px 4px;background:#1a1a2e;min-height:2px;transition:height .3s}
.bar-label{font-size:9px;font-weight:700;color:#aaa;white-space:nowrap}
.bar-val{font-size:9px;font-weight:800;color:#1a1a2e}

.stat-summary{display:flex;gap:10px}
.stat-card{flex:1;padding:14px;background:#f9f9fb;border-radius:14px;text-align:center}
.stat-card-label{font-size:11px;font-weight:700;color:#999;margin-bottom:4px}
.stat-card-num{font-size:20px;font-weight:900;color:#1a1a2e}
.stat-card-unit{font-size:11px;font-weight:700;color:#aaa}

/* Lock */
.lockscreen{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;touch-action:none;cursor:pointer}
.lockscreen.show{display:flex}
.lock-time{font-size:150px;font-weight:900;line-height:1;letter-spacing:-6px;color:#fff;transition:color .3s}
.lock-time.final{color:#FF8C42;animation:shake .3s ease infinite}
.lock-time.done{color:#34C759}
.lock-sets{font-size:15px;font-weight:700;color:rgba(255,255,255,.35)}
.lock-sets b{color:rgba(255,255,255,.75);font-size:18px;margin-left:4px}
.lock-hint{position:absolute;bottom:44px;font-size:11px;font-weight:700;color:rgba(255,255,255,.18);letter-spacing:1px}
.lock-status{font-size:13px;font-weight:700;color:rgba(255,255,255,.25);margin-bottom:6px}
.lock-close{position:absolute;top:48px;right:20px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.4);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:800}

.flash{position:fixed;inset:0;background:#1a1a2e;opacity:0;pointer-events:none;z-index:300;transition:opacity .08s}
.flash.on{opacity:.05}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div class="flash" id="flash"></div>

<!-- Lock Screen -->
<div class="lockscreen" id="lock">
  <button class="lock-close" id="lockClose">✕</button>
  <div class="lock-status" id="lockStatus">준비</div>
  <div class="lock-time" id="lockTime">1:00</div>
  <div class="lock-sets" id="lockSets"></div>
  <div class="lock-hint" id="lockHint">더블탭하여 시작</div>
</div>

<!-- Timer -->
<div class="page active" id="pgTimer">
  <div class="hdr"><div></div><button class="set-btn" id="settingsBtn"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.97l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.28 7.28 0 0 0-1.67-.97l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.67.97l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.97s.03.66.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.5.39 1.06.72 1.67.97l.38 2.65c.05.24.26.42.49.42h4c.24 0 .44-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.67-.97l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.49.49 0 0 0-.12-.64l-2.11-1.65z"/></svg></button></div>
  <div class="timer-wrap">
    <div class="timer-num" id="timer">1:00</div>
    <div class="timer-sub" id="label">준비</div>
    <div class="t-btns" id="tBtns"></div>
    <div class="adj-row"><button class="adj-b" id="dn">−</button><div class="adj-v" id="val">1:00</div><button class="adj-b" id="up">+</button></div>
    <button class="go" id="go">시작</button>
    <div class="sr"><div class="sl" data-k="sets">세트</div><div class="sn" id="sets">0</div><button class="sc" id="clr" data-k="reset">초기화</button></div>
  </div>
</div>

<!-- Calendar -->
<div class="page" id="pgCal">
  <div class="cal-hdr"><div class="cal-title" id="calTitle"></div><div class="cal-nav"><button class="cal-arr" id="calPrev">‹</button><button class="cal-arr" id="calNext">›</button></div></div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="summary-cards">
    <div class="sum-card"><div class="sum-card-label" data-k="weekTotal">이번 주</div><div class="sum-card-num" id="weekTotN">0</div></div>
    <div class="sum-card"><div class="sum-card-label" data-k="monthTotal">이번 달</div><div class="sum-card-num" id="calTotN">0</div></div>
  </div>
</div>

<!-- Stats -->
<div class="page" id="pgStats">
  <div class="stats-hdr"><h2 data-k="workout">운동 시간</h2></div>
  <div class="view-toggle">
    <button class="view-o on" data-v="day" data-k="daily">일별</button>
    <button class="view-o" data-v="week" data-k="weekly">주별</button>
    <button class="view-o" data-v="month" data-k="monthly">월별</button>
  </div>
  <div class="chart-area">
    <div class="chart-title" id="chartTitle"></div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="stat-summary">
    <div class="stat-card"><div class="stat-card-label" data-k="totalTime">총 운동</div><div class="stat-card-num" id="statTotal">0</div><div class="stat-card-unit" data-k="minutes">분</div></div>
    <div class="stat-card"><div class="stat-card-label" data-k="avgTime">평균</div><div class="stat-card-num" id="statAvg">0</div><div class="stat-card-unit" data-k="minPerDay">분/일</div></div>
  </div>
</div>

<!-- Tabs -->
<div class="tab-bar">
  <button class="tab active" data-pg="pgTimer"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 11h-2V7h2v6z"/></svg><span data-k="timer">타이머</span></button>
  <button class="tab" data-pg="pgCal"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg><span data-k="calendar">캘린더</span></button>
  <button class="tab" data-pg="pgStats"><svg viewBox="0 0 24 24"><path d="M3 13h2v8H3v-8zm6-6h2v14H9V7zm6-4h2v18h-2V3zm6 8h2v10h-2V11z"/></svg><span data-k="stats">통계</span></button>
</div>

<!-- Settings -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 data-k="settings">설정</h3>
    <div class="s-row"><div class="s-label" data-k="lang">언어</div><div class="lang-tog"><button class="lang-o on" data-lang="ko">한국어</button><button class="lang-o" data-lang="en">English</button></div></div>
    <div class="s-row col">
      <div class="s-label" data-k="presets">숏컷 설정</div>
      <div class="s-sub" data-k="presetsDesc">타이머 버튼을 추가/삭제할 수 있어요</div>
      <div class="pe-chips" id="peChips"></div>
      <div class="pe-add"><input class="pe-in" id="peMin" type="number" min="0" max="10" value="1"><span style="font-weight:800;color:#bbb">:</span><input class="pe-in" id="peSec" type="number" min="0" max="59" value="0" step="15"><button class="pe-btn" id="peAdd" data-k="add">추가</button></div>
    </div>
    <button class="m-close" id="modalClose" data-k="close">닫기</button>
  </div>
</div>

<script>
const L={
  ko:{ready:'준비',resting:'쉬는 중',done:'완료!',start:'시작',pause:'일시정지',resume:'재개',sets:'세트',reset:'초기화',settings:'설정',lang:'언어',close:'닫기',timer:'타이머',calendar:'캘린더',stats:'통계',monthTotal:'이번 달',weekTotal:'이번 주',presets:'숏컷 설정',presetsDesc:'타이머 버튼을 추가/삭제할 수 있어요',add:'추가',days:['일','월','화','수','목','금','토'],months:['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],suf:'세트',dbtap:'더블탭하여 시작',dbtapPause:'더블탭하여 일시정지',dbtapResume:'더블탭하여 재개',setLabel:'세트',workout:'운동 시간',daily:'일별',weekly:'주별',monthly:'월별',totalTime:'총 운동',avgTime:'평균',minutes:'분',minPerDay:'분/일',min:'분',noData:'아직 데이터가 없어요'},
  en:{ready:'Ready',resting:'Resting',done:'Done!',start:'Start',pause:'Pause',resume:'Resume',sets:'Sets',reset:'Clear',settings:'Settings',lang:'Language',close:'Close',timer:'Timer',calendar:'Calendar',stats:'Stats',monthTotal:'This month',weekTotal:'This week',presets:'Shortcut Presets',presetsDesc:'Add or remove timer buttons',add:'Add',days:['Su','Mo','Tu','We','Th','Fr','Sa'],months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],suf:'sets',dbtap:'Double-tap to start',dbtapPause:'Double-tap to pause',dbtapResume:'Double-tap to resume',setLabel:'Set',workout:'Workout Time',daily:'Daily',weekly:'Weekly',monthly:'Monthly',totalTime:'Total',avgTime:'Average',minutes:'min',minPerDay:'min/day',min:'min',noData:'No data yet'}
};
let lang='ko';function t(k){return L[lang][k]}

// Audio
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function ea(){if(!ac)ac=new AC();if(ac.state==='suspended')ac.resume()}
function beep(f,d,v=.4){ea();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}
function beepS(){beep(880,.12,.45)}
function beepL(){ea();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.value=1200;g.gain.value=.55;g.gain.setValueAtTime(.55,ac.currentTime);g.gain.setValueAtTime(.55,ac.currentTime+.5);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.85);o.start();o.stop(ac.currentTime+.9)}
function fl(){const f=$('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),120)}

let total=60,rem=60,run=false,iv=null,sets=0;
let presets=JSON.parse(localStorage.getItem('shagal-presets')||'[30,60,90,120,180]');
const $=id=>document.getElementById(id);
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

// Data: sets per day
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dk(new Date())}
function getData(){try{return JSON.parse(localStorage.getItem('shagal-data')||'{}')}catch(e){return{}}}
function saveSet(){const d=getData(),k=todayKey();d[k]=(d[k]||0)+1;localStorage.setItem('shagal-data',JSON.stringify(d))}

// Session tracking: array of {start, end} timestamps
function getSessions(){try{return JSON.parse(localStorage.getItem('shagal-sessions')||'[]')}catch(e){return[]}}
function saveSessions(s){localStorage.setItem('shagal-sessions',JSON.stringify(s))}

const SESSION_TIMEOUT=30*60*1000; // 30min
let sessionStart=null;

function touchSession(){
  const now=Date.now();
  let sessions=getSessions();
  if(sessions.length>0){
    const last=sessions[sessions.length-1];
    if(now-last.end<SESSION_TIMEOUT){
      last.end=now;
      saveSessions(sessions);
      return;
    }
  }
  sessions.push({start:now,end:now});
  saveSessions(sessions);
}

// Presets
function renderPresets(){const c=$('tBtns');c.innerHTML='';presets.sort((a,b)=>a-b).forEach(p=>{const b=document.createElement('button');b.className='t-btn'+(p===total?' on':'');b.dataset.t=p;b.textContent=fmt(p);b.addEventListener('click',()=>setT(p));c.appendChild(b)})}
function renderPE(){const c=$('peChips');c.innerHTML='';presets.sort((a,b)=>a-b).forEach(p=>{const d=document.createElement('div');d.className='pe-chip';d.innerHTML=fmt(p)+' <button class="pe-x" data-v="'+p+'">✕</button>';c.appendChild(d)});c.querySelectorAll('.pe-x').forEach(x=>x.addEventListener('click',()=>{presets=presets.filter(p=>p!==parseInt(x.dataset.v));localStorage.setItem('shagal-presets',JSON.stringify(presets));renderPresets();renderPE()}))}

function updLock(){
  $('lockTime').textContent=fmt(rem);
  const iF=rem<=3&&rem>0&&run,iD=rem===0&&!run;
  $('lockTime').className='lock-time'+(iF?' final':'')+(iD?' done':'');
  $('lockStatus').textContent=run?t('resting'):(iD?t('done'):t('ready'));
  $('lockSets').innerHTML=t('setLabel')+' <b>'+sets+'</b>';
  $('lockHint').textContent=run?t('dbtapPause'):(rem===0||rem===total?t('dbtap'):t('dbtapResume'));
}

function upd(){
  $('timer').textContent=fmt(rem);$('val').textContent=fmt(total);
  const iF=rem<=3&&rem>0&&run,iD=rem===0&&!run;
  $('timer').className='timer-num'+(iF?' final':'')+(iD?' done':'');
  $('label').textContent=run?t('resting'):(iD?t('done'):t('ready'));
  $('go').textContent=run?t('pause'):(rem===0?t('start'):(rem<total?t('resume'):t('start')));
  $('go').className='go'+(run?' running':'');
  $('sets').textContent=sets;
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.t)===total));
  updLock();
}

function tick(){
  if(rem<=0){stp();return}rem--;
  if(rem>=1&&rem<=3){beepS();fl()}
  else if(rem===0){beepL();fl();sets++;saveSet();touchSession();stp()}
  upd();
}
function go(){ea();touchSession();if(rem===0)rem=total;run=true;iv=setInterval(tick,1000);rwl();upd()}
function stp(){run=false;clearInterval(iv);iv=null;upd()}
function setT(s){if(run)return;total=Math.max(5,Math.min(600,s));rem=total;upd()}
async function rwl(){try{if('wakeLock'in navigator)await navigator.wakeLock.request('screen')}catch(e){}}

// Lock screen double-tap
let lastTap=0;
$('lock').addEventListener('touchend',function(e){if(e.target===$('lockClose'))return;const now=Date.now();if(now-lastTap<350){e.preventDefault();ea();if(run)stp();else go()}lastTap=now});
let lastTapM=0;
$('timer').addEventListener('touchend',function(e){const now=Date.now();if(now-lastTapM<350){e.preventDefault();$('lock').classList.add('show');updLock()}lastTapM=now});
$('lockClose').addEventListener('click',()=>$('lock').classList.remove('show'));

// Calendar
let cY,cM;(()=>{const n=new Date();cY=n.getFullYear();cM=n.getMonth()})();

function getWeekTotal(){
  const data=getData(),now=new Date(),day=now.getDay();
  let total=0;
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(now.getDate()-day+i);
    total+=(data[dk(d)]||0);
  }
  return total;
}

function renderCal(){
  $('calTitle').textContent=cY+' '+L[lang].months[cM];
  const g=$('calGrid');g.innerHTML='';
  L[lang].days.forEach(d=>{const e=document.createElement('div');e.className='cal-dl';e.textContent=d;g.appendChild(e)});
  const f=new Date(cY,cM,1).getDay(),l=new Date(cY,cM+1,0).getDate(),data=getData(),now=new Date();let mt=0;
  for(let i=0;i<f;i++){g.appendChild(document.createElement('div')).className='cal-c'}
  for(let d=1;d<=l;d++){
    const k=cY+'-'+String(cM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),s=data[k]||0;mt+=s;
    const isT=cY===now.getFullYear()&&cM===now.getMonth()&&d===now.getDate();
    const e=document.createElement('div');e.className='cal-c'+(s>0?' hd':'')+(isT?' td':'');
    e.innerHTML='<span>'+d+'</span>'+(s>0?'<span class="cs">'+s+L[lang].suf+'</span>':'');
    g.appendChild(e);
  }
  $('calTotN').textContent=mt;
  $('weekTotN').textContent=getWeekTotal();
}

// Stats
let statsView='day';

function getSessionMinutes(dateKey){
  const sessions=getSessions();
  const dayStart=new Date(dateKey+'T00:00:00').getTime();
  const dayEnd=dayStart+86400000;
  let mins=0;
  sessions.forEach(s=>{
    const ss=Math.max(s.start,dayStart);
    const se=Math.min(s.end,dayEnd);
    if(se>ss) mins+=(se-ss)/60000;
  });
  return Math.round(mins);
}

function getWeekKey(d){
  const jan1=new Date(d.getFullYear(),0,1);
  const wn=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return d.getFullYear()+'W'+String(wn).padStart(2,'0');
}

function renderStats(){
  const chart=$('chart');chart.innerHTML='';
  const now=new Date();
  let labels=[],values=[],titleText='';

  if(statsView==='day'){
    // Last 7 days
    for(let i=6;i>=0;i--){
      const d=new Date(now);d.setDate(now.getDate()-i);
      const key=dk(d);
      labels.push(L[lang].days[d.getDay()]);
      values.push(getSessionMinutes(key));
    }
    titleText=lang==='ko'?'최근 7일':'Last 7 days';
  } else if(statsView==='week'){
    // Last 8 weeks
    for(let w=7;w>=0;w--){
      const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay()-w*7);
      let wMin=0;
      for(let d=0;d<7;d++){
        const day=new Date(weekStart);day.setDate(weekStart.getDate()+d);
        wMin+=getSessionMinutes(dk(day));
      }
      const m=weekStart.getMonth()+1,dd=weekStart.getDate();
      labels.push(m+'/'+dd);
      values.push(wMin);
    }
    titleText=lang==='ko'?'최근 8주':'Last 8 weeks';
  } else {
    // Last 6 months
    for(let m=5;m>=0;m--){
      const month=new Date(now.getFullYear(),now.getMonth()-m,1);
      const last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
      let mMin=0;
      for(let d=1;d<=last;d++){
        const day=new Date(month.getFullYear(),month.getMonth(),d);
        mMin+=getSessionMinutes(dk(day));
      }
      labels.push(L[lang].months[month.getMonth()]);
      values.push(mMin);
    }
    titleText=lang==='ko'?'최근 6개월':'Last 6 months';
  }

  $('chartTitle').textContent=titleText;
  const maxV=Math.max(...values,1);

  labels.forEach((l,i)=>{
    const col=document.createElement('div');col.className='bar-col';
    const v=values[i];
    const h=Math.max(2,Math.round((v/maxV)*140));
    col.innerHTML='<div class="bar-val">'+(v>0?v+'':'')+'</div><div class="bar" style="height:'+h+'px;'+(v===0?'background:#e8e8ea':'')+'"></div><div class="bar-label">'+l+'</div>';
    chart.appendChild(col);
  });

  // Summary
  const allDays=new Set();
  const sessions=getSessions();
  let totalMin=0;
  sessions.forEach(s=>{totalMin+=(s.end-s.start)/60000;allDays.add(dk(new Date(s.start)))});
  totalMin=Math.round(totalMin);
  const avg=allDays.size>0?Math.round(totalMin/allDays.size):0;
  $('statTotal').textContent=totalMin;
  $('statAvg').textContent=avg;
}

function applyLang(){document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(L[lang][k])el.textContent=L[lang][k]});document.querySelectorAll('.lang-o').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));upd();renderCal();renderStats()}

// Events
$('go').addEventListener('click',()=>{ea();run?stp():go()});
$('up').addEventListener('click',()=>setT(total+15));
$('dn').addEventListener('click',()=>setT(total-15));
$('clr').addEventListener('click',()=>{sets=0;upd()});

document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  tab.classList.add('active');$(tab.dataset.pg).classList.add('active');
  if(tab.dataset.pg==='pgCal')renderCal();
  if(tab.dataset.pg==='pgStats')renderStats();
}));

$('calPrev').addEventListener('click',()=>{cM--;if(cM<0){cM=11;cY--}renderCal()});
$('calNext').addEventListener('click',()=>{cM++;if(cM>11){cM=0;cY++}renderCal()});
$('settingsBtn').addEventListener('click',()=>{renderPE();$('modalBg').classList.add('show')});
$('modalBg').addEventListener('click',e=>{if(e.target===$('modalBg'))$('modalBg').classList.remove('show')});
$('modalClose').addEventListener('click',()=>$('modalBg').classList.remove('show'));
document.querySelectorAll('.lang-o').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;applyLang()}));
$('peAdd').addEventListener('click',()=>{const tot=(parseInt($('peMin').value)||0)*60+(parseInt($('peSec').value)||0);if(tot>=5&&tot<=600&&!presets.includes(tot)){presets.push(tot);localStorage.setItem('shagal-presets',JSON.stringify(presets));renderPresets();renderPE()}});
document.querySelectorAll('.view-o').forEach(b=>b.addEventListener('click',()=>{statsView=b.dataset.v;document.querySelectorAll('.view-o').forEach(v=>v.classList.toggle('on',v.dataset.v===statsView));renderStats()}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run)rwl()});

renderPresets();upd();renderCal();
</script>
</body>
</html>
